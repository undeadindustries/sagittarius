# GoReleaser configuration for Sagittarius
# See https://goreleaser.com for documentation

version: 2

project_name: sagittarius

builds:
  - id: sagittarius
    binary: sagittarius
    main: ./cmd/sagittarius
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    # grammar_set_core embeds the curated Core100 find_symbol grammar set instead
    # of all ~200, keeping the release binary smaller. Matches the Makefile.
    flags:
      - -tags=grammar_set_core
    ldflags:
      - -s -w -X github.com/undeadindustries/sagittarius/internal/version.Version={{.Version}} -X github.com/undeadindustries/sagittarius/internal/version.Commit={{.ShortCommit}} -X github.com/undeadindustries/sagittarius/internal/version.BuildDate={{.Date}}

archives:
  - format: tar.gz
    name_template: "sagittarius_{{.Version}}_{{.Os}}_{{.Arch}}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

brews:
  - repository:
      owner: undeadindustries
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: "{{ not .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/undeadindustries/sagittarius"
    description: "Go AI agent CLI for building large projects, adminning systems, or personal assistance"
    license: "Apache-2.0"
    install: |
      bin.install "sagittarius"
    test: |
      system "#{bin}/sagittarius --version"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge"

release:
  draft: false
